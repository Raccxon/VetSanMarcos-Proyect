services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vetsanmarcos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vetsanmarcos"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-secreto-de-demostracion-de-al-menos-32-caracteres}
    ports:
      - "8080:8080"

  frontend:
    build: .
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  dbdata: