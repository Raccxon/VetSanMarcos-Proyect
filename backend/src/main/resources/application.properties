spring.application.name=vetsanmarcos-backend
server.port=8080

# --- Base de datos H2 en memoria (solo laboratorio) ---
spring.datasource.url=jdbc:h2:mem:vetsanmarcos;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA: Hibernate crea o actualiza las tablas a partir de las entidades ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console