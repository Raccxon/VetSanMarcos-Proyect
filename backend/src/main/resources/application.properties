spring.application.name=vetsanmarcos-backend
server.port=8080

# --- Base de datos PostgreSQL ---
# La clave NO se escribe aqui: se toma de la variable de entorno DB_PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:${DB_PORT:5432}/vetsanmarcos
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA: Hibernate crea o actualiza las tablas a partir de las entidades ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# --- JWT ---
# El secreto NO se escribe aqui: se toma de la variable de entorno JWT_SECRET (minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiracion-minutos=60